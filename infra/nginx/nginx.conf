# ControlPlane.ai — branded local URL (nginx reverse proxy)
#
# Goal: open the dashboard at a branded, port-free name (by default
# http://controlplane-ai.rtxcore) instead of http://localhost:3000, while every
# byte stays on this machine.
#
# This is the HOST-side variant, for when the stack is not run by docker compose
# (three-terminal mode). With `docker compose up` the proxy runs as a container
# and uses infra/nginx/docker.conf instead.
#
#   browser  ──http://controlplane-ai.rtxcore──▶  nginx :80 (loopback)
#                                          ├── /        → frontend      127.0.0.1:3000
#                                          ├── /api/    → dashboard API 127.0.0.1:8080
#                                          ├── /health  → dashboard API 127.0.0.1:8080
#                                          └── /v1/     → proxy         127.0.0.1:8900
#
# This file is intentionally self-contained and does NOT load the Homebrew
# default site (which listens on :8080 and would collide with the dashboard
# API). It binds loopback + port 80 only — nothing is reachable off-box.
#
# The branded name is outside the reserved *.localhost TLD, so it needs a
# one-time /etc/hosts alias:
#
#   ./scripts/setup_local_url.sh hosts controlplane-ai.rtxcore
#
# Use scripts/setup_local_url.sh, which installs that alias and starts/reloads
# this config, skipping itself when the Docker nginx already owns :80. Manual
# equivalent:
#
#   sudo nginx -c "$PWD/infra/nginx/nginx.conf"          # start
#   sudo nginx -c "$PWD/infra/nginx/nginx.conf" -s reload
#   sudo nginx -c "$PWD/infra/nginx/nginx.conf" -s stop
#
# Port 80 is privileged, hence sudo for the host variant. Note the Docker nginx
# service (docker-compose.yml) needs no sudo even with Colima — verified on this
# machine, so prefer that path. Either way the name resolves to loopback and
# never to a public address.

worker_processes 1;

# Runtime files live in /tmp so the config needs no repo-relative paths and
# leaves no root-owned files in the working tree.
pid /tmp/controlplane-nginx.pid;
error_log /tmp/controlplane-nginx-error.log warn;

events {
    worker_connections 256;
}

http {
    default_type application/octet-stream;
    access_log /tmp/controlplane-nginx-access.log;

    # Don't advertise the nginx version in headers or error pages.
    server_tokens off;

    # Upgrade/websocket plumbing for Next.js HMR (dev server).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream controlplane_frontend {
        server 127.0.0.1:3000;
    }

    upstream controlplane_api {
        server 127.0.0.1:8080;
    }

    upstream controlplane_proxy {
        server 127.0.0.1:8900;
    }

    server {
        # :80 so the address bar shows no port. `default_server` means any name
        # that resolves to loopback works (controlplane-ai.rtxcore, …).
        listen 80 default_server;
        server_name controlplane-ai.rtxcore _;

        # --- Dashboard API: REST + SSE verdict stream ---
        location /api/ {
            proxy_pass http://controlplane_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # SSE (/api/v1/verdicts/stream) must never be buffered.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Frontend health probe hits `${API_BASE}/health` — keep it on the API.
        location = /health {
            proxy_pass http://controlplane_api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # --- Governance proxy (same routes the apps use: /v1/messages, …) ---
        location /v1/ {
            proxy_pass http://controlplane_proxy;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # LLM responses can be slow; the fast-path itself is <10ms.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }

        # --- Next.js dashboard (everything else) ---
        location / {
            proxy_pass http://controlplane_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Streaming responses from Next (e.g. RSC payloads) stay unbuffered.
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
