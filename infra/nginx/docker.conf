# ControlPlane.ai — branded local URL (nginx inside docker compose)
#
# Mounted over /etc/nginx/nginx.conf by the `nginx` service in docker-compose.yml,
# which publishes host :80 — so this whole file is a complete nginx config.
# It starts automatically with:
#
#   docker compose up --build
#
#   browser  ──http://controlplane-ai.rtxcore──▶  nginx :80
#                                              ├── /        → frontend   :3000
#                                              ├── /api/    → gateway    :8080 (REST + SSE)
#                                              ├── /health  → gateway    :8080
#                                              └── /v1/     → gateway    :8900 (governance proxy)
#
# Upstreams are compose service names (in-network DNS). Loopback-only: Docker
# publishes :80 on this machine, and nothing is forwarded off-box.
#
# Open it at http://controlplane-ai.rtxcore — the branded name is outside the
# reserved *.localhost TLD (RFC 6761), so it needs a one-time /etc/hosts alias:
#
#   ./scripts/setup_local_url.sh hosts controlplane-ai.rtxcore
#
# This server is `default_server`, so any name that resolves to loopback works.
#
# The host-run counterpart (three-terminal mode, nginx on the host) is
# infra/nginx/nginx.conf — it proxies 127.0.0.1 instead of service names.

user  nginx;
worker_processes 1;

# The official nginx image symlinks these two paths to stdout/stderr, so
# `docker compose logs nginx` shows request lines and errors without a mounted
# log volume. Keep the stock paths — a bare /dev/stdout fails as the nginx user.
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;

    server_tokens off;

    # Upgrade/websocket plumbing (Next.js HMR when the frontend runs in dev mode
    # behind this proxy).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS. Upstreams are resolved per request (`valid=10s`)
    # instead of once at startup, so recreating containers — which hands them new
    # IPs — does not leave this proxy pointing at stale addresses (502s) until it
    # is restarted. That is why the targets below are `set` variables used in
    # proxy_pass rather than `upstream` blocks: a variable forces re-resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        # :80 so the address bar shows no port. `default_server` means any name
        # resolving to loopback works (controlplane-ai.rtxcore, …).
        listen 80 default_server;
        server_name controlplane-ai.rtxcore _;

        set $frontend_upstream frontend:3000;
        set $api_upstream      gateway:8080;
        set $proxy_upstream    gateway:8900;

        # --- Dashboard API: REST + SSE verdict stream ---
        location /api/ {
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # SSE (/api/v1/verdicts/stream) must never be buffered.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Frontend health probe hits `${API_BASE}/health` — keep it on the API.
        location = /health {
            proxy_pass http://$api_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # --- Governance proxy (same routes the apps use: /v1/messages, …) ---
        location /v1/ {
            proxy_pass http://$proxy_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # LLM responses can be slow; the fast-path itself is <10ms.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }

        # --- Next.js dashboard (everything else) ---
        location / {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Keep streaming responses (SSE, RSC payloads) unbuffered.
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
