version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: controlplane-postgres
    environment:
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: controlplane
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlplane"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: controlplane-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--jetstream", "--monitor_port", "8222"]
    healthcheck:
      test: ["CMD", "nats-server", "--signal", "ldm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
