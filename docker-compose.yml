# Full-stack docker-compose for ControlPlane.ai
# Usage: docker compose up --build
#
# This starts all services: PostgreSQL, NATS, mock upstream, gateway, and frontend.
# After startup, open http://localhost:3000 for the dashboard.

services:
  # --- Infrastructure ---
  postgres:
    image: postgres:16-alpine
    container_name: controlplane-postgres
    environment:
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: controlplane
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlplane"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: controlplane-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Python Guardrails (Presidio + LLM Guard) ---
  guardrails:
    build:
      context: ./services/guardrails
      dockerfile: Dockerfile
    container_name: controlplane-guardrails
    ports:
      - "8200:8200"
    environment:
      PORT: "8200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --- Rust Gateway (Proxy + Dashboard API) ---
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controlplane-gateway
    environment:
      DATABASE_URL: postgres://controlplane:secret@postgres:5432/controlplane
      NATS_URL: nats://nats:4222
      EVENT_BUS: inproc
      PROXY_LISTEN_ADDR: 0.0.0.0:8900
      DASHBOARD_API_PORT: "8081"
      UPSTREAM_PROVIDER: opencode
      UPSTREAM_BASE_URL: https://opencode.ai
      UPSTREAM_API_KEY: ""
      UPSTREAM_MODEL: x-preview-f-free
      GUARDRAILS_URL: http://guardrails:8200
      JWT_SECRET: change-me-in-production
      RUST_LOG: controlplane=info,tower_http=info
    ports:
      - "8900:8900"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      guardrails:
        condition: service_started

  # --- Next.js Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: controlplane-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  pgdata:
