# Full-stack docker-compose for ControlPlane.ai
#
# Pipeline: Client → ControlPlane Proxy → Ollama (qwen2.5:1.5b) → ControlPlane governance → Client
# After startup, open the dashboard at either:
#   http://controlplane-ai.rtxcore             branded, port-free. Outside the
#                                              reserved *.localhost TLD, so it
#                                              needs a one-time hosts alias:
#                                              ./scripts/setup_local_url.sh hosts
#                                                controlplane-ai.rtxcore
#   http://localhost:3000                      direct, unchanged default
#
# Usage:
#   CPU only:  docker compose up --build
#   With GPU:  docker compose --profile gpu up --build
#
# The `laya` service (Laya decision model) answers the hallucination check; it starts by
# default and downloads its ~800 MB English checkpoint on first start.
#
# The GPU profile uses NVIDIA CUDA. Requires nvidia-container-toolkit installed on host.
# If no GPU is available, use the default (CPU) mode — it works out of the box.
#
# Every published port is bound to 127.0.0.1: the dashboard API runs in demo-mode
# auth (no token required) and Postgres uses a default password, so none of it
# should be reachable from the network. To reach a service from another device,
# drop the "127.0.0.1:" prefix on that port deliberately.

services:
  # --- Infrastructure ---
  postgres:
    image: postgres:16-alpine
    container_name: controlplane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: controlplane
    ports:
      # Configurable: a native PostgreSQL install often owns 5432. Services in the
      # stack connect to postgres:5432 on the compose network either way.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlplane"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Ollama LLM Provider (CPU by default, GPU via override) ---
  # To enable NVIDIA GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
  ollama:
    image: ollama/ollama:latest
    container_name: controlplane-ollama
    restart: unless-stopped
    ports:
      # Host port is configurable: a native Ollama install already owns 11434 on
      # many machines. The stack itself reaches this container as ollama:11434.
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # Pull the qwen2.5:1.5b model after Ollama is healthy (one-shot init container)
  ollama-pull:
    image: ollama/ollama:latest
    container_name: controlplane-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c", "ollama pull qwen2.5:1.5b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

  # --- Python Guardrails Sidecar (Presidio + Toxicity + Bias) ---
  guardrails:
    build:
      context: ./services/guardrails
      dockerfile: Dockerfile
    container_name: controlplane-guardrails
    # Come back after a crash (e.g. an OOM kill) or a Docker/host restart.
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      PORT: "8200"
      TOXICITY_THRESHOLD: "0.7"
      BIAS_THRESHOLD: "0.66"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --- Laya decision model: answers the hallucination check ---
  # A Jev-compatible non-autoregressive "System One" decision model. The shadow path asks
  # it only whether a response is supported by the request's grounding context
  # (hallucination, severity, groundedness). Scores only; the decision engine decides.
  laya:
    build:
      context: ./services/laya
      dockerfile: Dockerfile
    container_name: controlplane-laya
    # Keep it up across crashes and Docker restarts.
    restart: unless-stopped
    # Run a minimal init as PID 1 so laya-serve is a normal child process: the
    # healthcheck watchdog must be able to kill it, and PID 1 ignores signals.
    init: true
    ports:
      - "127.0.0.1:8300:8000"
    environment:
      LAYA_DEVICE: cpu
      # Lazy-load checkpoints: serve as soon as the English checkpoint is ready and load
      # the multilingual one on first non-English request. With preload ("1") the server
      # won't listen until BOTH are downloaded, and the ~650 MB multilingual download
      # repeatedly stalled here, leaving Laya down. Set "1" once both are cached.
      LAYA_PRELOAD: "0"
      # Fail a stalled Hugging Face download instead of hanging on it forever.
      HF_HUB_DOWNLOAD_TIMEOUT: "60"
      HF_HUB_ETAG_TIMEOUT: "30"
      # laya-serve deadlocked twice after bursts of concurrent requests (all threads
      # asleep, nothing answered). Disable the HF tokenizers' internal thread pool and pin
      # the torch/OpenMP pools — the standard fix for tokenizer/torch thread deadlocks in
      # multi-threaded servers. The healthcheck watchdog below covers anything left.
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    volumes:
      # Persist the ~1.4 GB of Hugging Face checkpoints so a rebuild/recreate doesn't
      # download them again.
      - laya_models:/root/.cache/huggingface
    healthcheck:
      # Real HTTP request + watchdog: 3 attempts x 10 s; if laya-serve never answers
      # (deadlocked with its port still open), healthcheck.py kills PID 1 and
      # `restart: unless-stopped` restarts the container. Docker never restarts a
      # container just for being unhealthy, so without this a hang lasts until noticed.
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 45s
      retries: 2
      start_period: 180s

  # --- Rust Gateway (Proxy + Dashboard API + All Workers) ---
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controlplane-gateway
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://controlplane:secret@postgres:5432/controlplane
      EVENT_BUS: inproc
      PROXY_LISTEN_ADDR: 0.0.0.0:8900
      DASHBOARD_API_PORT: "8080"
      UPSTREAM_PROVIDER: ollama
      UPSTREAM_BASE_URL: http://ollama:11434
      UPSTREAM_MODEL: qwen2.5:1.5b
      GUARDRAILS_URL: http://guardrails:8200
      # Per-scan timeout for the guardrails sidecar (PII, toxicity, bias).
      GUARDRAILS_TIMEOUT_MS: "10000"
      JWT_SECRET: change-me-in-production
      SEED_DEMO_USERS: "true"
      # Laya answers the hallucination check (3 questions per call, only when the request
      # carries grounding context). Unset LAYA_URL to skip that check.
      LAYA_URL: http://laya:8000
      # Per-call budget for the Laya hallucination check (async shadow path; never delays
      # the response).
      LAYA_TIMEOUT_MS: "10000"
      RUST_LOG: controlplane=info,tower_http=info
    ports:
      - "127.0.0.1:8900:8900"
      # Configurable host port for the dashboard API; the browser normally reaches
      # it through nginx (:80 /api/), and other containers use gateway:8080.
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      guardrails:
        condition: service_healthy
      ollama:
        condition: service_healthy

  # --- MCP server (Model Context Protocol gateway for external agents) ---
  # Not on the request path: agents talk to it, and dashboard/proxy traffic is
  # unaffected if it is down. It re-implements no governance logic — every tool
  # maps onto a gateway endpoint. Only a bearer token is required to call it,
  # see MCP_AUTH_TOKENS in .env.example.
  mcp-server:
    build:
      context: .
      dockerfile: services/mcp-server/Dockerfile
    container_name: controlplane-mcp
    restart: unless-stopped
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_ADDR: 0.0.0.0:8090
      # Container-internal service names, not localhost.
      CONTROLPLANE_API_URL: http://gateway:8080
      CONTROLPLANE_PROXY_URL: http://gateway:8900
      CONTROLPLANE_GUARDRAILS_URL: http://guardrails:8200
      # The guardrails sidecar is internal-only; scans stay off by default.
      MCP_ENABLE_INTERNAL_SCANS: ${MCP_ENABLE_INTERNAL_SCANS:-false}
      MCP_AUTH_TOKENS: ${MCP_AUTH_TOKENS:-dev-admin:admin,dev-reviewer:reviewer,dev-viewer:viewer}
      CONTROLPLANE_PROXY_API_KEY: ${CONTROLPLANE_PROXY_API_KEY:-}
      MCP_ALLOW_ANONYMOUS: ${MCP_ALLOW_ANONYMOUS:-false}
      MCP_RATE_LIMIT_PER_MIN: "120"
      MCP_RATE_LIMIT_BURST: "30"
      MCP_REQUEST_TIMEOUT_MS: "15000"
      RUST_LOG: controlplane_mcp_server=info
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      gateway:
        condition: service_started

  # --- Next.js Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Override in .env to serve the dashboard same-origin through the nginx
        # proxy below, e.g.
        #   NEXT_PUBLIC_API_URL=http://controlplane-ai.rtxcore
        # and then no localhost appears in any network call. Defaults keep the
        # direct URLs so `http://localhost:3000` works even if the proxy is down.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_PROXY_URL: ${NEXT_PUBLIC_PROXY_URL:-http://localhost:8900}
        # Override to use a faster npm mirror when registry.npmjs.org is slow:
        #   NPM_REGISTRY=https://registry.npmmirror.com docker compose up --build
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: controlplane-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_PROXY_URL: ${NEXT_PUBLIC_PROXY_URL:-http://localhost:8900}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - gateway

  # --- nginx reverse proxy: the branded, port-free local URL ---
  # Publishes :80 on the host, so the browser shows
  # http://controlplane-ai.rtxcore instead of localhost:3000.
  # Routes / → frontend, /api/ + /health → gateway dashboard
  # API (REST + SSE, unbuffered), /v1/ → governance proxy. Config lives in
  # infra/nginx/docker.conf. Loopback-only: Docker publishes :80 on this
  # machine and nothing is forwarded off-box. No host nginx and no sudo —
  # if port 80 is already taken, this one container fails to start and every
  # other service is unaffected.
  nginx:
    image: nginx:1.27-alpine
    container_name: controlplane-nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/docker.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:80:80"
      # IPv6 loopback too: the hosts alias maps the branded name to ::1 as well.
      - "[::1]:80:80"
    depends_on:
      - frontend
      - gateway

volumes:
  pgdata:
  ollama_models:
  laya_models:
